<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242427"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- Online/Active Tech Status Dot -->
  <circle cx="102" cy="26" r="7" fill="#10b981" stroke="#121214" stroke-width="2.5"/>

  <!-- Monogram AY -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Letter A -->
    <path d="M 44 36 L 54 36 L 68 88 L 56 88 L 52.5 73 L 33.5 73 L 30 88 L 18 88 Z M 36.5 61 L 49.5 61 L 43 38 Z" />
    
    <!-- Letter Y -->
    <path d="M 69 36 L 82 36 L 93 59 L 104 36 L 117 36 L 100 68 L 100 88 L 88 88 L 88 68 Z" />
  </g>
</svg>